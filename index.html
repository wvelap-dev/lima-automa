<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lima Automa - Ofertas Exclusivas de Restaurantes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            text-align: center;
            color: white;
            max-width: 500px;
        }
        .logo {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 20px;
        }
        .logo span {
            color: #e94560;
        }
        .subtitle {
            font-size: 18px;
            opacity: 0.8;
            margin-bottom: 40px;
        }
        .coupon-icon {
            font-size: 80px;
            margin-bottom: 30px;
        }
        .info {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 30px;
        }
        .info p {
            margin: 10px 0;
            font-size: 14px;
            opacity: 0.9;
        }
        .footer {
            font-size: 12px;
            opacity: 0.5;
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">Lima<span>Automa</span></div>
        <div class="subtitle">Ofertas exclusivas de restaurantes en Lima</div>
        
        <div class="coupon-icon">🎫</div>
        
        <div class="info">
            <p>Escanea el codigo QR en tu restaurante favorito</p>
            <p>Obtienes descuentos exclusivos</p>
            <p>Sin registro, sin complicaciones</p>
        </div>
        
        <div class="footer">
            Powered by Lima Automa &copy; 2026
        </div>
    </div>
</body>
</html>
